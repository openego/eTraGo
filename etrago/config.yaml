# =============================================================================
# Biogas.SH / SWFL scenario configuration
# =============================================================================
# Version 3 matches the current storage-aware Biogas.SH model and the detailed
# SWFL unit representation.
#
# In normal use, edit "selection", "batch", and, when needed, "run".
# =============================================================================

version: 3

project:
  name: "Biogas.SH"
  description: "Storage-aware Biogas.SH and detailed Stadtwerke Flensburg scenarios"

# =============================================================================
# SCENARIO SELECTION
# =============================================================================
#
# This block selects one complete Biogas.SH model run.
#
# CORE SCENARIO DESIGN
# --------------------
# In the main analysis only TWO dimensions are varied:
#
#   1. fossil_gas_price_case
#   2. support_case
#
# This gives:
#
#       4 gas-price cases × 3 support cases = 12 core scenarios
#
# All other assumptions are kept fixed so that differences between runs can
# be attributed clearly to:
#
#   - fossil-gas market conditions, and
#   - EEG / flexibilisation policy.
#
# IMPORTANT:
# The Biogas.SH route is ALWAYS "hybrid" in the core analysis.
# This means that all physical utilisation pathways are simultaneously
# available and the optimiser decides how to allocate the common raw-biogas
# resource between them.
#
# Available hybrid routes:
#
#   Raw biogas
#      ├──> onsite CHP electricity
#      ├──> onsite heat
#      └──> central biomethane production
#                └──> central storage
#                       ├──> public CH4 grid
#                       └──> dedicated SWFL biomethane route
#
# The three major pathways have been checked separately with debug runs:
#
#   onsite utilisation                -> functional
#   biomethane -> public CH4 grid     -> functional
#   biomethane -> SWFL / K12-K13      -> functional
#
# Therefore, zero flow on one of these routes in a normal scenario can be
# interpreted as an optimisation result rather than automatically as a
# missing physical connection.
# =============================================================================

selection:

  # ---------------------------------------------------------------------------
  # 1. FOSSIL NATURAL-GAS PRICE CASE
  # ---------------------------------------------------------------------------
  #
  # Main market sensitivity.
  #
  # Available choices:
  #
  #   "low_2035"
  #       Low gas-price sensitivity.
  #       Represents a future with relatively inexpensive fossil natural gas.
  #
  #   "legacy_egon"
  #       Original eGon/eTraGo 2035 assumption.
  #       Useful mainly as a direct comparison with the original model setup.
  #
  #   "high_2035"
  #       Higher 2035 gas-price case combined with a high EU ETS CO2 price.
  #
  #   "crisis_2035"
  #       Stress case with persistently high fossil-gas prices.
  #       Intended as an upper-price sensitivity, not as a central forecast.
  #
  # CORE RUNS:
  # Run all four cases for every support scenario.
  #
  fossil_gas_price_case: "high_2035"


  # ---------------------------------------------------------------------------
  # 2. BIOMETHANE COST CASE
  # ---------------------------------------------------------------------------
  #
  # In the core scenarios this is FIXED.
  #
  # Available choices:
  #
  #   "project_92_9"
  #       Main Biogas.SH project assumption:
  #
  #           92.9 EUR/MWh_Hs biomethane
  #
  #       This is the simplified project-specific all-in cost representing
  #       raw biogas plus the central collection/upgrading pathway and the
  #       associated infrastructure/full-cost assumptions.
  #
  #   "debug_10"
  #       DEBUG ONLY.
  #
  #       Artificial biomethane cost:
  #
  #           10 EUR/MWh_Hs
  #
  #       Used only to force biomethane dispatch and verify that the central
  #       upgrading, storage, public-grid and SWFL routes are technically
  #       functional.
  #
  #       DO NOT use this case for economic interpretation.
  #
  # CORE RUNS:
  # Always use "project_92_9".
  #
  biomethane_price_case: "project_92_9"

  co2_sale_case: "medium_76_5"


  # ---------------------------------------------------------------------------
  # 3. EEG / FLEXIBILITY SUPPORT CASE
  # ---------------------------------------------------------------------------
  #
  # Main policy dimension of the study.
  #
  # Available choices:
  #
  #   "post_eeg"
  #
  #       Scenario S1: Post-EEG / market-only operation
  #
  #       - no follow-on EEG support
  #       - no supported CHP generation tranche
  #       - no CHP flexibilisation
  #       - CHP capacity multiplier = 1
  #       - no flexibility payment
  #
  #       Route allocation is mainly driven by market conditions.
  #
  #
  #   "followon_eeg_no_flex"
  #
  #       Scenario S3: Follow-on EEG without flexibilisation
  #
  #       - follow-on EEG support active
  #       - supported CHP operating-cost assumption active
  #       - supported operating-hours abstraction active
  #       - existing CHP capacity retained
  #       - CHP capacity multiplier = 1
  #       - no flexibility payment
  #
  #       Comparison:
  #
  #           S3 - S1
  #
  #       isolates the effect of continued EEG support.
  #
  #
  #   "followon_eeg_flex"
  #
  #       Scenario S2: Follow-on EEG + flexibilisation
  #
  #       - follow-on EEG support active
  #       - supported CHP operating-cost assumption active
  #       - supported operating-hours abstraction active
  #       - electrical CHP capacity expanded exogenously
  #       - CHP capacity multiplier = 3
  #       - flexibility payment considered in scenario economics
  #
  #       Comparison:
  #
  #           S2 - S3
  #
  #       isolates the additional effect of flexibilisation.
  #
  # CORE RUNS:
  # Run all three support cases for every fossil-gas price case.
  #
  support_case: "followon_eeg_flex"


  # ---------------------------------------------------------------------------
  # 4. SWFL HEAT-PUMP CONFIGURATION
  # ---------------------------------------------------------------------------
  #
  # Technical assumption for the Stadtwerke Flensburg system.
  #
  # CORE RUNS:
  # Keep this fixed so that heat-pump configuration does not become another
  # scenario dimension.
  #
  # Current core configuration:
  #
  #   "two"
  #       Use the two modelled/planned SWFL heat pumps.
  #
  # Other values should only be used if a corresponding case is explicitly
  # defined in the heat-pump case configuration.
  #
  heat_pump_case: "one_gwp1"


  # ---------------------------------------------------------------------------
  # 5. SWFL UNIT AVAILABILITY
  # ---------------------------------------------------------------------------
  #
  # Controls which modelled Stadtwerke Flensburg generation / heat-production
  # units are available.
  #
  # CORE RUNS:
  #
  #   "all_operational"
  #       All units represented as operational in the selected model setup
  #       remain available.
  #
  # Keep fixed across the 12 core scenarios so that changing unit availability
  # does not obscure the gas-price and support effects.
  #
  swfl_unit_case: "all_operational"


  # ---------------------------------------------------------------------------
  # 6. BIOMETHANE USE AT SWFL
  # ---------------------------------------------------------------------------
  #
  # Defines which SWFL units are allowed to receive biomethane from the
  # dedicated Biogas.SH -> SWFL biomethane bus.
  #
  # CORE RUNS:
  #
  #   "k12_k13_only"
  #       Dedicated project biomethane may be supplied to K12 and K13.
  #
  # The public natural-gas supply remains a separate pathway.
  #
  # Thus the model can distinguish between:
  #
  #       public CH4 grid -> SWFL natural-gas system
  #
  # and
  #
  #       Biogas.SH storage -> SWFL biomethane bus -> K12/K13
  #
  biomethane_use_case: "off"


  # ---------------------------------------------------------------------------
  # 7. BIOGAS.SH ROUTE CONFIGURATION
  # ---------------------------------------------------------------------------
  #
  # ALWAYS use "hybrid" for the main analysis.
  #
  #   "hybrid"
  #
  # means that the optimiser simultaneously has access to:
  #
  #       1. onsite CHP electricity
  #       2. onsite heat
  #       3. central biomethane -> public CH4 grid
  #       4. central biomethane -> direct SWFL route
  #
  # These are NOT separate scenario assumptions.
  #
  # The purpose of the optimisation is precisely to determine which route,
  # or combination of routes, is economically preferred under each gas-price
  # and policy scenario.
  #
  # Consequently, do NOT switch between individual routes for the core
  # scenario comparison.
  #
  # Route-exclusive configurations should only be used as explicit debugging
  # or validation tests.
  #
  biogas_route_case: "hybrid_raw_swfl"

# ---------------------------------------------------------------------------

# Each batch entry overrides only the values shown in that entry. All other
# dimensions are inherited from "selection" above. The four entries below
# therefore run the same technical scenario with four fossil-gas price cases.
batch:
  enabled: false
  stop_on_error: true
  scenarios:
    - fossil_gas_price_case: "low_2035"
    - fossil_gas_price_case: "legacy_egon"
    - fossil_gas_price_case: "high_2035"
    - fossil_gas_price_case: "crisis_2035"

# Null means: preserve the corresponding value already defined in appl.py.
run:
  start_snapshot: 1
  end_snapshot: 10
  ac_clusters: 50
  result_name_template: "{scenario}_{hours}h_{ac_clusters}ac"

# -----------------------------------------------------------------------------
# PRICE CASES
# -----------------------------------------------------------------------------
# The natural-gas value is an ADDER on the public-grid -> SWFL supply Link.
# Keep "upstream_only" when the public CH4 grid already carries the commodity
# cost, otherwise the gas price may be counted twice.
price_cases:
  fossil_gas:
    low_2035:
      description: >
        Low-price sensitivity using an IEA-derived linear
        extrapolation to 2035 and the EU Commission CO2 price.
      gas_commodity_price_eur_per_mwh_fuel: 13.0
      gas_source: >
        IEA (2025), researcher-derived linear extrapolation
        from the 2025–2030 pathway
      gas_value_status: "derived sensitivity, not an official IEA 2035 forecast"
      co2_price_eur_per_tco2: 50.0
      co2_source: "European Commission (2021), EU Reference Scenario 2020"
      emission_factor_tco2_per_mwh_fuel: 0.201
      swfl_import_adder_eur_per_mwh_fuel: 0.0

    legacy_egon:
      description: >
        Original eGon/eTraGo assumptions based on the
        NEP 2021 forecast for 2035.
      gas_commodity_price_eur_per_mwh_fuel: 25.6
      gas_source: "NEP 2021 / eGon2035"
      gas_value_status: "original model assumption"
      co2_price_eur_per_tco2: 76.5
      co2_source: "NEP 2021 / eGon2035"
      emission_factor_tco2_per_mwh_fuel: 0.201
      swfl_import_adder_eur_per_mwh_fuel: 0.0

    high_2035:
      description: >
        Higher gas-price and updated high EU ETS 1 scenario.
      gas_commodity_price_eur_per_mwh_fuel: 34.125
      gas_source: "EWI (2022), extrapolated/model-derived 2035 value"
      gas_value_status: "high-price sensitivity"
      co2_price_eur_per_tco2: 144.0
      co2_source: "UBA (2025), EU ETS 1 assumption for 2035"
      emission_factor_tco2_per_mwh_fuel: 0.201
      swfl_import_adder_eur_per_mwh_fuel: 0.0

    crisis_2035:
      description: >
        Persistent-crisis sensitivity using the IRU crisis
        gas-price level and the UBA EU ETS 1 price.
      gas_commodity_price_eur_per_mwh_fuel: 60.0
      gas_source: >
        IRU (2026), short-term crisis price assumed to persist
        as a stress scenario through 2035
      gas_value_status: "stress assumption, not a long-term forecast"
      co2_price_eur_per_tco2: 144.0
      co2_source: "UBA (2025), EU ETS 1 assumption for 2035"
      emission_factor_tco2_per_mwh_fuel: 0.201
      swfl_import_adder_eur_per_mwh_fuel: 0.0

  biomethane:
      project_92_9:
          description: >
            Biogas.SH project-specific fixed all-in biomethane cost.
            Includes raw biogas, collection pipeline, upgrading,
            central storage/infrastructure and associated full costs.
          marginal_cost_eur_per_mwh_hs: 92.9
      debug_10:
          description: >
            for debugging.
          marginal_cost_eur_per_mwh_hs: 10.0


  onsite:
      raw_biogas_cost_eur_per_mwh_hs: 75.0

      electricity_efficiency: 0.38
      heat_efficiency: 0.45

      # 75 / 0.38
      merchant_electricity_marginal_cost_eur_per_mwh: 197.37

      # 75 / 0.45
      heat_marginal_cost_eur_per_mwh: 166.67

      # Follow-on EEG modelling assumption
      eeg_premium_eur_per_mwh: 87.06

      # 197.37 - 87.06
      supported_electricity_marginal_cost_eur_per_mwh: 110.31


# -----------------------------------------------------------------------------
# BIOGENIC CO2 SALES
# -----------------------------------------------------------------------------
co2_sale_cases:

  none:
    description: >
      No economic value assigned to separated biogenic CO2.
    active: false
    sale_price_eur_per_t: 0.0
    additional_cost_eur_per_t: 0.0
    marketable_fraction: 1.0
    co2_yield_t_per_mwh_biomethane: 0.12365

  low_50:
    description: >
      CO2 valorisation sensitivity at 50 EUR/tCO2.
    active: true
    sale_price_eur_per_t: 50.0
    additional_cost_eur_per_t: 0.0
    marketable_fraction: 1.0
    co2_yield_t_per_mwh_biomethane: 0.12365

  medium_76_5:
    description: >
      CO2 valorisation sensitivity at 76.5 EUR/tCO2.
    active: true
    sale_price_eur_per_t: 76.5
    additional_cost_eur_per_t: 0.0
    marketable_fraction: 1.0
    co2_yield_t_per_mwh_biomethane: 0.12365

  high_144:
    description: >
      CO2 valorisation sensitivity at 144 EUR/tCO2.
    active: true
    sale_price_eur_per_t: 144.0
    additional_cost_eur_per_t: 0.0
    marketable_fraction: 1.0
    co2_yield_t_per_mwh_biomethane: 0.12365

# -----------------------------------------------------------------------------
# BIOGAS.SH SUPPORT CASES
# -----------------------------------------------------------------------------
support_cases:

  post_eeg:
    description: >
      Post-EEG market-only operation.
      No follow-on EEG and no flexibilisation.

    eeg_active: false
    supported_hours_per_year: 0.0

    flexibility_active: false
    chp_capacity_multiplier: 1.0

    flexibility_payment_eur_per_kw_year: 0.0


  followon_eeg_no_flex:
    description: >
      Follow-on EEG support for existing CHP capacity,
      without additional flexibilisation.

    eeg_active: true
    supported_hours_per_year: 2920.0

    flexibility_active: false
    chp_capacity_multiplier: 1.0

    flexibility_payment_eur_per_kw_year: 0.0


  followon_eeg_flex:
    description: >
      Follow-on EEG plus flexibilisation.
      Electrical CHP capacity is represented as three times
      the existing capacity while annual raw-biogas availability
      remains unchanged.

    eeg_active: true
    supported_hours_per_year: 2920.0

    flexibility_active: true
    chp_capacity_multiplier: 3.0

    # Used for reporting/economic interpretation.
    # We do NOT make CHP capacity endogenous in this version.
    flex_capex_eur_per_kw: 800.0
    flex_lifetime_years: 15
    flex_discount_rate: 0.05
    flex_fixed_om_fraction: 0.02
    flexibility_payment_eur_per_kw_year: 100.0


# -----------------------------------------------------------------------------
# HEAT-PUMP CASES
# -----------------------------------------------------------------------------
heat_pump_cases:
  none:
    description: "Remove the legacy eGon SWFL heat pump and add no planned GWP."
    active_units: []

  one_gwp1:
    description: "Use only GWP 1."
    active_units:
      - "swfl_gwp_1"

  one_gwp2:
    description: "Use only GWP 2."
    active_units:
      - "swfl_gwp_2"

  two:
    description: "Use GWP 1 and GWP 2."
    active_units:
      - "swfl_gwp_1"
      - "swfl_gwp_2"

# -----------------------------------------------------------------------------
# SWFL UNIT-AVAILABILITY CASES
# -----------------------------------------------------------------------------
# Heat pumps are controlled independently above.
swfl_unit_cases:
  all_operational:
    description: "Gas-to-power, K5/K11/K12/K13, EHK1 and EHK2."
    central_gas_to_power: true
    boilers:
      - "swfl_real_k5"
      - "swfl_real_k11"
      - "swfl_real_k12"
      - "swfl_real_k13"
    resistive_heaters:
      - "swfl_real_ehk1"
      - "swfl_real_ehk2"
    reserve_gas_boiler: false

  gas_units_only:
    description: "Gas-to-power and all four boilers; no resistive heaters."
    central_gas_to_power: true
    boilers:
      - "swfl_real_k5"
      - "swfl_real_k11"
      - "swfl_real_k12"
      - "swfl_real_k13"
    resistive_heaters: []
    reserve_gas_boiler: false

  k12_k13_plus_gas_to_power:
    description: "Gas-to-power plus K12 and K13."
    central_gas_to_power: true
    boilers:
      - "swfl_real_k12"
      - "swfl_real_k13"
    resistive_heaters: []
    reserve_gas_boiler: false

  k12_k13_only:
    description: "K12 and K13 only."
    central_gas_to_power: false
    boilers:
      - "swfl_real_k12"
      - "swfl_real_k13"
    resistive_heaters: []
    reserve_gas_boiler: false

  electric_heat_only:
    description: "EHK1 and EHK2 only; planned heat pumps remain independent."
    central_gas_to_power: false
    boilers: []
    resistive_heaters:
      - "swfl_real_ehk1"
      - "swfl_real_ehk2"
    reserve_gas_boiler: false

# -----------------------------------------------------------------------------
# BIOMETHANE ELIGIBILITY AT SWFL
# -----------------------------------------------------------------------------
biomethane_use_cases:
  "off":
    mode: "off"
    eligible_units: []

  k12_k13_only:
    mode: "custom"
    eligible_units:
      - "swfl_real_k12"
      - "swfl_real_k13"

  all_gas_units:
    mode: "custom"
    eligible_units:
      - "swfl_real_k5"
      - "swfl_real_k11"
      - "swfl_real_k12"
      - "swfl_real_k13"

# -----------------------------------------------------------------------------
# BIOGAS.SH ROUTE CASES
# -----------------------------------------------------------------------------
#
# Physical routes:
#
#   onsite:
#       raw biogas -> onsite electricity / heat
#
#   storage_to_grid:
#       raw biogas -> upgrading -> biomethane
#       -> central storage -> public CH4 grid
#
#   storage_to_swfl:
#       LEGACY / sensitivity route:
#       raw biogas -> upgrading -> biomethane
#       -> central storage -> SWFL
#
#   hybrid:
#       LEGACY hybrid:
#       onsite + public-grid biomethane + SWFL biomethane
#
#   hybrid_raw_swfl:
#       CURRENT PROJECT ROUTE:
#       onsite + public-grid biomethane
#       + direct raw biogas -> SWFL
#
# The raw-biogas -> SWFL route bypasses upgrading and therefore:
#
#   - has no upgrading loss,
#   - does not use the biomethane storage,
#   - does not receive the CO2-sale credit.
# -----------------------------------------------------------------------------

biogas_route_cases:

  onsite:
    description: >
      Use only onsite electricity and heat generation.

    add_local_generation: true
    add_gas_grid_generation: false
    add_swfl_direct_supply: false
    add_swfl_raw_biogas_supply: false


  storage_to_grid:
    description: >
      Upgrade raw biogas to biomethane and route it through
      central storage to the public CH4 grid.

    add_local_generation: false
    add_gas_grid_generation: true
    add_swfl_direct_supply: false
    add_swfl_raw_biogas_supply: false


  storage_to_swfl:
    description: >
      Legacy sensitivity route. Upgrade raw biogas to
      biomethane and route it through central storage
      to the dedicated SWFL biomethane bus.

    add_local_generation: false
    add_gas_grid_generation: false
    add_swfl_direct_supply: true
    add_swfl_raw_biogas_supply: false


  hybrid:
    description: >
      Legacy hybrid route with onsite generation,
      public-grid biomethane injection and upgraded
      biomethane supply to SWFL.

    add_local_generation: true
    add_gas_grid_generation: true
    add_swfl_direct_supply: true
    add_swfl_raw_biogas_supply: false


  hybrid_raw_swfl:
    description: >
      Main project route. Enable onsite electricity and heat,
      upgraded biomethane injection into the public CH4 grid,
      and direct non-upgraded raw-biogas supply to SWFL.

    add_local_generation: true

    # Raw biogas -> upgrading -> biomethane
    # -> storage -> public CH4 grid
    add_gas_grid_generation: true

    # No upgraded biomethane supply to SWFL.
    add_swfl_direct_supply: false

    # Raw biogas is delivered directly to SWFL.
    add_swfl_raw_biogas_supply: true

# -----------------------------------------------------------------------------
# TECHNICAL ASSUMPTIONS
# -----------------------------------------------------------------------------
technical:

  # ===========================================================================
  # STADTWERKE FLENSBURG SYSTEM
  # ===========================================================================
  swfl:

    # -------------------------------------------------------------------------
    # Main SWFL buses
    # -------------------------------------------------------------------------
    #
    # Natural gas, upgraded biomethane, and raw biogas remain on separate
    # buses so that their flows and economics can be tracked independently.
    #
    buses:
      ac: "33935"

      heat: "swfl_real_central_heat_bus"

      # Fossil natural-gas supply to SWFL.
      natural_gas: "biogas_sh_swfl_ch4_bus"

      # Dedicated upgraded-biomethane bus.
      # Used only when add_swfl_direct_supply=true.
      biomethane: "swfl_real_biomethane_ch4_bus"

      # Dedicated non-upgraded raw-biogas bus.
      # Used by the direct raw-biogas -> SWFL route.
      raw_biogas: "swfl_real_raw_biogas_bus"

      # Existing public CH4-grid bus.
      public_ch4: "47538"


    # -------------------------------------------------------------------------
    # SWFL / Flensburg spatial area
    # -------------------------------------------------------------------------
    selected_mv_grid_district_ids:
      - "33935"
      - "33543"
      - "35906"


    # -------------------------------------------------------------------------
    # SWFL demand assumptions
    # -------------------------------------------------------------------------
    loads:

      # null preserves the heat-profile path already configured in appl.py.
      heat_csv_path: null

      heat_year: 2023

      heat_datetime_column: "timestamp"

      heat_column: "hkw_heat_mw"

      # Annual SWFL electricity demand.
      ac_target_annual_demand_mwh: 381516.0


    # -------------------------------------------------------------------------
    # SWFL central gas-to-power unit
    # -------------------------------------------------------------------------
    #
    # This is currently represented as an electricity-only gas conversion
    # Link. The detailed heat side is represented separately by K5/K11/K12/K13.
    #
    central_gas_to_power:

      # Electrical output capacity.
      electric_capacity_mw: 241.0

      # Fuel -> electricity efficiency.
      electric_efficiency: 0.40

      # Fuel costs are represented upstream.
      marginal_cost_eur_per_mwh: 0.0


    # -------------------------------------------------------------------------
    # SWFL fuel-fired heat units
    # -------------------------------------------------------------------------
    #
    # Heat capacities refer to useful thermal output.
    #
    boilers:

      swfl_real_k5:
        heat_capacity_mw: 60.0
        efficiency: 0.90

      swfl_real_k11:
        heat_capacity_mw: 70.0
        efficiency: 0.90

      swfl_real_k12:
        heat_capacity_mw: 80.0
        efficiency: 0.90

      swfl_real_k13:
        heat_capacity_mw: 90.0
        efficiency: 0.90


    # -------------------------------------------------------------------------
    # SWFL electrode / resistive heaters
    # -------------------------------------------------------------------------
    resistive_heaters:

      swfl_real_ehk1:
        heat_capacity_mw: 30.0
        efficiency: 0.99

      swfl_real_ehk2:
        heat_capacity_mw: 40.0
        efficiency: 0.99


    # -------------------------------------------------------------------------
    # Planned SWFL large heat pumps
    # -------------------------------------------------------------------------
    heat_pumps:

      swfl_gwp_1:
        heat_capacity_mw: 60.0
        cop: 3.0
        planned_year: 2028

      swfl_gwp_2:
        heat_capacity_mw: 60.0
        cop: 3.0
        planned_year: null


    # -------------------------------------------------------------------------
    # Optional reserve heating plant
    # -------------------------------------------------------------------------
    reserve_gas_boiler:

      heat_capacity_mw: 203.0

      efficiency: 1.0


  # ===========================================================================
  # BIOGAS.SH SYSTEM
  # ===========================================================================
  biogas_sh:

    # -------------------------------------------------------------------------
    # Conversion efficiencies
    # -------------------------------------------------------------------------
    #
    # These efficiencies are used by the shared annual raw-biogas
    # resource constraint.
    #
    efficiencies:

      # Raw biogas -> onsite electricity.
      onsite_electricity: 0.38

      # Raw biogas -> onsite useful heat.
      onsite_heat: 0.45

      # Raw biogas -> upgraded biomethane.
      upgrading: 0.96


    # -------------------------------------------------------------------------
    # Direct raw-biogas delivery to Stadtwerke Flensburg
    # -------------------------------------------------------------------------
    #
    # Physical route:
    #
    #     regional raw biogas
    #           |
    #           v
    #     collection / transport
    #           |
    #           v
    #     SWFL raw-biogas bus
    #           |
    #           +----> K12
    #           |
    #           +----> K13
    #
    # This route bypasses biomethane upgrading completely.
    #
    # Therefore:
    #
    #   - no eta_upgrade is applied,
    #   - no biomethane production cost is applied,
    #   - no separated-CO2 sales credit is applied.
    #
    # The raw-biogas commodity cost itself is NOT defined here.
    # It comes from:
    #
    #   price_cases.onsite.raw_biogas_cost_eur_per_mwh_hs
    #
    # Current value:
    #
    #   75.00 EUR/MWh_Hs
    #
    direct_raw_biogas_to_swfl:

      # Dedicated SWFL raw-biogas bus.
      target_bus: "swfl_real_raw_biogas_bus"

      # Source-derived collection / transport adder.
      #
      # Delivered raw-biogas marginal cost is therefore:
      #
      #   75.00 + 8.78
      #   = 83.78 EUR/MWh_Hs
      #
      transport_cost_eur_per_mwh_hs: 8.78

      # Aggregate raw-biogas delivery capacity.
      #
      # null means:
      #
      #   p_nom =
      #       total annual regional raw-biogas potential / 8760
      #
      power_capacity_mw: null

      # Stable component identifiers used by biogas_sh.py.
      generator_name: "biogas_sh_raw_biogas_swfl_supply"

      generator_carrier: "biogas_sh_raw_biogas_swfl"

      bus_carrier: "raw_biogas"

      # SWFL units physically allowed to use direct raw biogas.
      eligible_units:
        - "swfl_real_k12"
        - "swfl_real_k13"


    # -------------------------------------------------------------------------
    # Shared regional raw-biogas resource constraint
    # -------------------------------------------------------------------------
    #
    # REQUIRED for the hybrid_raw_swfl topology.
    #
    # All competing Biogas.SH pathways draw from the same regional
    # raw-biogas resource:
    #
    #     onsite electricity / eta_el
    #
    #   + onsite heat / eta_heat
    #
    #   + upgraded biomethane / eta_upgrade
    #
    #   + direct raw biogas -> SWFL
    #
    #   <= available annual raw-biogas potential
    #
    # Direct raw biogas -> SWFL enters with factor 1.0 because there is
    # no upgrading step.
    #
    resource_constraint:

      active: true

      ignore_missing_components: false


    # -------------------------------------------------------------------------
    # Public natural-gas grid -> SWFL connection
    # -------------------------------------------------------------------------
    #
    # This route provides fossil natural gas to SWFL independently of the
    # Biogas.SH raw-biogas and biomethane routes.
    #
    # Fossil-gas commodity and CO2 costs are represented upstream at
    # CH4_NG generators. Therefore no fuel cost is added here.
    #
    public_grid_to_swfl:

      power_capacity_mw: 1500.0

      efficiency: 1.0

      capital_cost_eur_per_mw: 0.0


    # -------------------------------------------------------------------------
    # Central upgraded-biomethane storage
    # -------------------------------------------------------------------------
    #
    # IMPORTANT:
    #
    # This storage belongs only to the upgraded biomethane pathway:
    #
    #     raw biogas
    #         -> upgrading
    #         -> biomethane
    #         -> central storage
    #
    # The direct raw-biogas -> SWFL route does NOT pass through this storage.
    #
    storage:

      active: true


      # -----------------------------------------------------------------------
      # Storage energy capacity
      # -----------------------------------------------------------------------

      energy_capacity_mwh: 500.0

      # TODO:
      # Verify this value against the documented physical storage volume
      # of approximately 5,000 m3.

      initial_energy_mwh: 0.0

      cyclic: true

      standing_loss: 0.0


      # -----------------------------------------------------------------------
      # Plant biomethane -> central storage
      # -----------------------------------------------------------------------
      plant_to_storage:

        efficiency: 1.0

        marginal_cost_eur_per_mwh: 0.0


      # -----------------------------------------------------------------------
      # Central storage -> public CH4 grid
      # -----------------------------------------------------------------------
      storage_to_public_grid:

        power_capacity_mw: 50.0

        efficiency: 1.0

        marginal_cost_eur_per_mwh: 0.0


      # -----------------------------------------------------------------------
      # Central storage -> SWFL upgraded-biomethane route
      # -----------------------------------------------------------------------
      #
      # Retained for legacy / sensitivity scenarios such as:
      #
      #   storage_to_swfl
      #   hybrid
      #
      # This route is NOT used when:
      #
      #   biogas_route_case = "hybrid_raw_swfl"
      #
      storage_to_swfl:

        power_capacity_mw: 50.0

        efficiency: 1.0

        marginal_cost_eur_per_mwh: 0.0

# -----------------------------------------------------------------------------
# OPTIONAL FACTORIAL SENSITIVITY MATRIX
# -----------------------------------------------------------------------------

scenario_matrix:

  enabled: true

  dimensions:

    support_case:
      - "post_eeg"
      - "followon_eeg_no_flex"
      - "followon_eeg_flex"


    fossil_gas_price_case:
      - "low_2035"
      - "legacy_egon"
      - "high_2035"
      - "crisis_2035"


    # Fixed project biomethane-cost assumption.
    biomethane_price_case:
      - "project_92_9"


    # Fixed CO2-sale assumption for this matrix.
    co2_sale_case:
      - "medium_76_5"


    # Fixed heat-pump configuration.
    heat_pump_case:
      - "one_gwp1"


    # Fixed SWFL generation configuration.
    swfl_unit_case:
      - "all_operational"


    # Upgraded biomethane is NOT supplied directly to SWFL.
    biomethane_use_case:
      - "off"


    # Main project topology:
    #
    # onsite +
    # biomethane -> public grid +
    # raw biogas -> SWFL
    biogas_route_case:
      - "hybrid_raw_swfl"